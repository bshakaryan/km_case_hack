name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  PUSH_ENABLED: "false"
  PYTHONUNBUFFERED: "1"

jobs:
  backend:
    name: Backend / SQLite and PostgreSQL 17
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: naryad
          POSTGRES_PASSWORD: naryad_ci
          POSTGRES_DB: naryad_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U naryad -d naryad_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRESQL_URL: postgresql+psycopg://naryad:naryad_ci@localhost:5432/naryad_ci
      REQUIRE_POSTGRESQL_TESTS: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install pinned backend dependencies
        run: python -m pip install -r requirements.txt
      # SQLite fixtures seed their isolated demo databases. PostgreSQL tests
      # explicitly disable seeding and create only their own test records.
      - name: Test API and migrations on both databases
        run: python -m pytest -q

  web:
    name: Web / tests and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "11.25.0"
          run_install: false
          cache: true
          cache_dependency_path: frontend/pnpm-lock.yaml
          package_json_file: frontend/package.json
      - name: Install locked web dependencies
        run: pnpm install --frozen-lockfile
      - name: Test web API and access policy
        run: pnpm test
      - name: Build web application
        run: pnpm build

  mobile:
    name: Flutter / analysis and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: "3.47.0" # Dart 3.13.0, matching pubspec.lock.
          cache: true
          pub-cache: true
          pub-cache-key: flutter-pub-${{ runner.os }}-3.47.0-${{ hashFiles('mobile/pubspec.lock') }}
      - name: Install locked Flutter dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze Flutter code
        run: flutter analyze --no-pub
      # These tests use HTTP/platform doubles; no device, Firebase credentials
      # or running backend is required. The opt-in live API test remains skipped.
      - name: Test Flutter controllers and widgets
        run: flutter test --no-pub --concurrency=2

  ai-policy:
    name: AI / runtime policy and data sources
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ai_service
    env:
      DATA_SOURCE: synthetic
      DEMO_MODE: "true"
      DEADLINE_SCHEDULER_ENABLED: "false"
      LLM_PROVIDER: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements-ai-checks.txt
      - name: Install only policy and data-source dependencies
        run: python -m pip install -r ../.github/requirements-ai-checks.txt
      # No application runtime, CV/model packages, downloads or live providers.
      - name: Test isolated AI boundaries
        run: python -m pytest -q tests/test_runtime_policy.py tests/test_datasources.py tests/test_phase7.py

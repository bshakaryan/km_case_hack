name: Docker stack

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the complete stack
        run: ./scripts/docker-up.sh
      - name: Backend regression tests (isolated SQLite)
        run: docker compose exec -T backend python -m pytest -q
      - name: Leave integration and concurrency (isolated PostgreSQL schemas)
        run: docker compose exec -T -e POSTGRES_TEST=1 backend python -m pytest -q tests/test_zup.py tests/test_requests.py tests/test_persistence.py
      - name: Smoke test through frontend and PostgreSQL persistence
        run: docker compose exec -T backend python - < scripts/compose_smoke.py
      - name: Restart with the existing database
        run: |
          docker compose down
          ./scripts/docker-up.sh
          docker compose exec -T backend python - < scripts/compose_smoke.py
      - name: Diagnostics
        if: failure()
        run: docker compose ps -a && docker compose logs --no-color --tail=100
      - name: Stop containers
        if: always()
        run: docker compose down

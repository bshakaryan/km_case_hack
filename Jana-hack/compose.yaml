services:
  zup-mock:
    build: ./backend
    restart: unless-stopped
    init: true
    environment:
      ZUP_API_TOKEN: ${ZUP_API_TOKEN:-${JWT_SECRET:?Set JWT_SECRET in .env}}
      ZUP_MOCK_DATABASE: /app/zup-data/zup.sqlite3
    command: ["uvicorn", "app.mock_zup:app_factory", "--factory", "--host", "0.0.0.0", "--port", "8300"]
    volumes:
      - zup_mock_data:/app/zup-data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8300/health')"]
      interval: 5s
      timeout: 5s
      retries: 15
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: jana
      POSTGRES_USER: jana
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jana -d jana"]
      interval: 5s
      timeout: 5s
      retries: 15
  migrate:
    build: ./backend
    environment: &backend_env
      DATABASE_URL: postgresql+psycopg://jana:${POSTGRES_PASSWORD}@postgres:5432/jana
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Set DEMO_PASSWORD in .env}
      ZUP_MODE: ${ZUP_MODE:-mock}
      ZUP_BASE_URL: ${ZUP_DOCKER_BASE_URL:-http://zup-mock:8300/hs/jana/v1}
      ZUP_AUTH_TYPE: ${ZUP_AUTH_TYPE:-bearer}
      ZUP_API_TOKEN: ${ZUP_API_TOKEN:-${JWT_SECRET:?Set JWT_SECRET in .env}}
      ZUP_USERNAME: ${ZUP_USERNAME:-}
      ZUP_PASSWORD: ${ZUP_PASSWORD:-}
      ZUP_TIMEOUT_SECONDS: ${ZUP_TIMEOUT_SECONDS:-5}
      ZUP_VERIFY_TLS: ${ZUP_VERIFY_TLS:-true}
      ZUP_CA_BUNDLE: ${ZUP_CA_BUNDLE:-}
      ZUP_CLIENT_CERT: ${ZUP_CLIENT_CERT:-}
      ZUP_CLIENT_KEY: ${ZUP_CLIENT_KEY:-}
      ZUP_ALLOW_INSECURE_HTTP: ${ZUP_ALLOW_INSECURE_HTTP:-false}
    command: ["sh", "-c", "alembic upgrade head && if [ \"$${ZUP_MODE:-mock}\" = mock ]; then python -m app.seed; else echo 'ZUP_MODE=real: demo seed skipped'; fi"]
    depends_on:
      postgres:
        condition: service_healthy
      zup-mock:
        condition: service_healthy
  backend:
    build: ./backend
    restart: unless-stopped
    init: true
    environment: *backend_env
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
  frontend:
    restart: unless-stopped
    init: true
    build:
      context: ./frontend
      args:
        API_INTERNAL_URL: http://backend:8000
    environment:
      API_INTERNAL_URL: http://backend:8000
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
  zup-worker:
    build: ./backend
    restart: unless-stopped
    init: true
    environment: *backend_env
    command: ["python", "-m", "app.zup_worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  postgres_data:
  zup_mock_data:

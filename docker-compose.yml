name: naryad-ai

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-naryad_ai}
      POSTGRES_USER: ${POSTGRES_USER:-naryad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demo-only-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  ai-review:
    build:
      context: ./ai_service
    command: ["uvicorn", "app.attempt_bridge:create_attempt_app", "--factory", "--host", "0.0.0.0", "--port", "8010", "--no-access-log"]
    restart: unless-stopped
    environment:
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?Set AI_SERVICE_TOKEN in the ignored root .env file}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_VISION_MODEL: ${OPENAI_VISION_MODEL:-gpt-6-astra}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/healthz', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      ai-review:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-naryad}:${POSTGRES_PASSWORD:-demo-only-change-me}@db:5432/${POSTGRES_DB:-naryad_ai}
      SEED_DEMO: ${SEED_DEMO:-true}
      AI_REVIEW_MODE: ${AI_REVIEW_MODE:-queued_service}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-review:8010}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?Set AI_SERVICE_TOKEN in the ignored root .env file}
      AI_VISION_CONFIGURED: ${OPENAI_API_KEY:+true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      # Without FCM credentials the API records notifications but does not deliver push.
      FIREBASE_CREDENTIALS: ${FIREBASE_CREDENTIALS:-}
      FIREBASE_CREDENTIALS_JSON: ${FIREBASE_CREDENTIALS_JSON:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-km-case-hack}
      PUSH_ENABLED: ${PUSH_ENABLED:-false}
      PUSH_DISPATCH_SECONDS: ${PUSH_DISPATCH_SECONDS:-3}
      PUSH_MAX_ATTEMPTS: ${PUSH_MAX_ATTEMPTS:-8}
      # Real FCM delivery fallback: mount the git-ignored backend/secrets/
      # directory read-only and set FIREBASE_CREDENTIALS to the key inside.
      # When uncommented, this environment entry must stay at this indentation
      # to remain inside the `environment:` block.
      # FIREBASE_CREDENTIALS: /run/secrets/km-case-hack-firebase-adminsdk-fbsvc-43f1ce1b97.json
      TZ: Asia/Almaty
    # volumes:
    #   - ./backend/secrets:/run/secrets:ro
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  frontend:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:

name: naryad-ai

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-naryad_ai}
      POSTGRES_USER: ${POSTGRES_USER:-naryad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demo-only-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-naryad}:${POSTGRES_PASSWORD:-demo-only-change-me}@db:5432/${POSTGRES_DB:-naryad_ai}
      SEED_DEMO: ${SEED_DEMO:-true}
      AI_PROVIDER: ${AI_PROVIDER:-stub}
      AI_MODEL: ${AI_MODEL:-gpt-4.1-mini}
      OPEN_AI_API_KEY: ${OPEN_AI_API_KEY:-}
      DUE_SOON_MINUTES: ${DUE_SOON_MINUTES:-30}
      ACCEPT_MINUTES: ${ACCEPT_MINUTES:-10}
      EMERGENCY_ACCEPT_MINUTES: ${EMERGENCY_ACCEPT_MINUTES:-3}
      REMINDER_REPEAT_MINUTES: ${REMINDER_REPEAT_MINUTES:-30}
      MANAGER_ESCALATION_MINUTES: ${MANAGER_ESCALATION_MINUTES:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      TZ: Asia/Almaty
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  frontend:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:


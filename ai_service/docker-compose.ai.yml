name: naryad-ai-service

services:
  ai:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      BACKEND_URL: ${AI_DOCKER_BACKEND_URL:-http://backend:8000}
      AI_DATABASE_URL: sqlite:////app/state/ai.db
      SYNTHETIC_DATA_PATH: /app/data/snapshot.json
    ports:
      - "127.0.0.1:${AI_PORT:-8090}:8090"
    volumes:
      - ai_state:/app/state
      - ./data:/app/data:ro
    networks:
      - naryad_backend

volumes:
  ai_state:

networks:
  naryad_backend:
    external: true
    name: naryad-ai_default

services:
  backend:
    environment:
      AI_PROVIDER: service
      AI_SERVICE_URL: http://ai:8090
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?Set a long random AI_SERVICE_TOKEN in root .env}

  frontend:
    ports: !override
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:8080"

  ai:
    build:
      context: ./ai_service
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - path: ./ai_service/.env
        required: false
    environment:
      DATA_SOURCE: backend
      BACKEND_URL: http://backend:8000
      BACKEND_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?Set a long random AI_SERVICE_TOKEN in root .env}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?Set a long random AI_SERVICE_TOKEN in root .env}
      AI_DATABASE_URL: sqlite:////app/state/ai.db
    volumes:
      - ai_state:/app/state
    ports:
      - "127.0.0.1:${AI_PORT:-8090}:8090"

volumes:
  ai_state:
